# Builds the Android APK in the cloud and publishes it as a GitHub Release.
# Run it: GitHub repo → Actions → "Build Android APK" → Run workflow → paste your app URL.
# Stable download link afterwards:
#   https://github.com/<you>/<repo>/releases/latest/download/IGReach.apk
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your hosted app URL (https://…, e.g. https://ig-reach.onrender.com)"
        required: true
      version_name:
        description: "Version shown to users"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK ready: $(ls "$ANDROID_HOME/platforms")"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fail=0
          for v in KS_B64 KS_PASS K_ALIAS K_PASS; do
            if [ -z "$(printf '%s' "${!v}" | tr -d '[:space:]')" ]; then echo "::error::Secret for $v is empty"; fail=1; fi
          done
          [ $fail = 1 ] && exit 1
          # strip stray spaces/newlines from copy-paste
          printf '%s' "$KS_B64" | tr -d '[:space:]' > b64.txt
          if ! base64 -d b64.txt > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_B64 is not valid base64 — re-copy the whole long line."; exit 1
          fi
          rm b64.txt
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          K_ALIAS=$(printf '%s' "$K_ALIAS" | tr -d '[:space:]')
          K_PASS=$(printf '%s' "$K_PASS" | tr -d '[:space:]')
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEYSTORE_B64 is cut short."; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$K_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS is wrong (should be igreach)."; exit 1
          fi
          if [ "$K_PASS" != "$KS_PASS" ]; then
            echo "::error::ANDROID_KEY_PASSWORD must be the same as ANDROID_KEYSTORE_PASSWORD."; exit 1
          fi
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$K_ALIAS" | grep 'SHA256:' | awk '{print $2}')
          echo "Key fingerprint: $FP"
          if [ "$FP" != "0C:66:FA:19:0B:30:A4:83:A2:B1:61:1D:CB:86:3E:0A:3D:77:31:E4:C2:6B:88:FD:BB:BA:30:CC:96:40:56:8E" ]; then
            echo "::warning::Key fingerprint differs from the one on the server — app will show a browser bar until ANDROID_SHA256 on Render is updated."
          fi
          echo "All 4 signing secrets verified ✅"
          echo "KS_PASS_CLEAN=$KS_PASS" >> "$GITHUB_ENV"
          echo "K_ALIAS_CLEAN=$K_ALIAS" >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ env.KS_PASS_CLEAN }}
          KEY_ALIAS: ${{ env.K_ALIAS_CLEAN }}
          KEY_PASSWORD: ${{ env.KS_PASS_CLEAN }}
        run: |
          gradle assembleRelease --no-daemon \
            -PappUrl="${{ inputs.app_url }}" \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/IGReach.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs IGReach.apk | tee certs.txt
          echo "### APK built ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing cert:" >> "$GITHUB_STEP_SUMMARY"
          grep SHA-256 certs.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: IG Reach ${{ inputs.version_name }} (build ${{ github.run_number }})
          body: |
            Android app for ${{ inputs.app_url }}
            Install on phone: open ${{ inputs.app_url }}/download
          files: IGReach.apk
          make_latest: true

      - name: Download link
        run: |
          echo "Download: https://github.com/${{ github.repository }}/releases/latest/download/IGReach.apk" >> "$GITHUB_STEP_SUMMARY"
